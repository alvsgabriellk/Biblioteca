<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema de Biblioteca</title>
<style>
  /* Reaproveitando sua base de estilos */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0ece4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    background: #ffffff;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    border: 0.5px solid #d6d0c8;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    animation: fadeIn 0.4s ease;
  }

  .auth-header {
    background: #1a1a2e;
    padding: 30px;
    text-align: center;
    color: #e2d9c8;
  }

  .lib-icon {
    width: 48px;
    height: 48px;
    background: #c9a96e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }

  .lib-icon svg {
    width: 28px;
    height: 28px;
    fill: #1a1a2e;
  }

  .auth-body {
    padding: 30px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 15px;
  }

  .form-group label {
    font-size: 12px;
    font-weight: 500;
    color: #6b7280;
  }

  .form-group input {
    padding: 12px;
    border: 0.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    background: #f9fafb;
    outline: none;
    transition: 0.2s;
  }

  .form-group input:focus {
    border-color: #c9a96e;
    box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.12);
  }

  .btn-primary {
    width: 100%;
    padding: 12px;
    background: #1a1a2e;
    color: #c9a96e;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #6b7280;
  }

  .auth-footer a {
    color: #1a1a2e;
    text-decoration: none;
    font-weight: 600;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="lib-icon">
        <svg viewBox="0 0 24 24"><path d="M4 19V6.5L12 3l8 3.5V19H4zm2-2h12V7.6l-6-2.6-6 2.6V17zm3-3h6v-2H9v2zm0-4h6V8H9v2z"/></svg>
      </div>
      <h3>Acessar Sistema</h3>
    </div>
    <div class="auth-body">
      <form action="/cliente/login" method="POST">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" name="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <div class="auth-footer">
        Ainda não tem conta? <a href="/cadastro">Cadastre-se</a>
      </div>
    </div>
  </div>
</body>
</html>
