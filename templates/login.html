<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema de Biblioteca</title>
<style>
  /* Reaproveitando sua base de estilos */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0ece4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    background: #ffffff;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    border: 0.5px solid #d6d0c8;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    animation: fadeIn 0.4s ease;
  }

  .auth-header {
    background: #1a1a2e;
    padding: 30px;
    text-align: center;
    color: #e2d9c8;
  }

  .lib-icon {
    width: 48px;
    height: 48px;
    background: #c9a96e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }

  .lib-icon svg {
    width: 28px;
    height: 28px;
    fill: #1a1a2e;
  }

  .auth-body {
    padding: 30px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 15px;
  }

  .form-group label {
    font-size: 12px;
    font-weight: 500;
    color: #6b7280;
  }

  .form-group input {
    padding: 12px;
    border: 0.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    background: #f9fafb;
    outline: none;
    transition: 0.2s;
  }

  .form-group input:focus {
    border-color: #c9a96e;
    box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.12);
  }

  .btn-primary {
    width: 100%;
    padding: 12px;
    background: #1a1a2e;
    color: #c9a96e;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #6b7280;
  }

  .auth-footer a {
    color: #1a1a2e;
    text-decoration: none;
    font-weight: 600;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

 .toast-container {
  position: fixed;
  top: 1.25rem;
  right: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 0.5px solid;
  border-left-width: 3px;
  min-width: 300px;
  max-width: 380px;
  background: #fff;
  position: relative;
  animation: toastIn 0.35s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
}

.toast.hide {
  animation: toastOut 0.3s ease forwards;
}

.toast.success { border-color: #1D9E75; }
.toast.error   { border-color: #E24B4A; }

.toast-icon {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  font-size: 11px;
  font-weight: 500;
}

.toast.success .toast-icon { background: #E1F5EE; color: #0F6E56; }
.toast.error   .toast-icon { background: #FCEBEB; color: #A32D2D; }

.toast-body { flex: 1; }

.toast-title {
  font-size: 13px;
  font-weight: 500;
  margin: 0 0 2px;
}

.toast.success .toast-title { color: #085041; }
.toast.error   .toast-title { color: #791F1F; }

.toast-msg {
  font-size: 13px;
  color: #666;
  margin: 0;
  line-height: 1.5;
}

.toast-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: #999;
  padding: 0;
}

.toast-close:hover { color: #333; }

.toast-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 3px;
  border-radius: 0 0 12px 12px;
  animation: progressShrink 4s linear forwards;
}

.toast.success .toast-progress { background: #1D9E75; }
.toast.error   .toast-progress { background: #E24B4A; }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(60px) scale(0.95); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); max-height: 200px; }
  to   { opacity: 0; transform: translateX(60px); max-height: 0; padding: 0; }
}

@keyframes progressShrink {
  from { width: 100%; }
  to   { width: 0%; }
}
</style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="lib-icon">
        <svg viewBox="0 0 24 24"><path d="M4 19V6.5L12 3l8 3.5V19H4zm2-2h12V7.6l-6-2.6-6 2.6V17zm3-3h6v-2H9v2zm0-4h6V8H9v2z"/></svg>
      </div>
      <h3>Acessar Sistema</h3>
    </div>
    <div class="auth-body">
      <form action="/login/entrar" method="POST">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" name="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <div class="auth-footer">
        Ainda não tem conta? <a href="/cadastro">Cadastre-se</a>
      </div>
    </div>
  </div>


<div id="toast-container" class="toast-container"></div>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <script type="application/json" id="flash-data">
    {{ messages | tojson }}
  </script>
  {% endif %}
{% endwith %}


<script>
const _TOAST_TITLES = { success: 'Sucesso!', error: 'Erro!' };
const _TOAST_ICONS  = { success: '✓', error: '✕' };

function showToast(category, message) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + category;
  toast.innerHTML = `
    <div class="toast-icon">${_TOAST_ICONS[category] ?? '!'}</div>
    <div class="toast-body">
      <p class="toast-title">${_TOAST_TITLES[category] ?? category}</p>
      <p class="toast-msg">${message}</p>
    </div>
    <button class="toast-close" onclick="closeToast(this.parentElement)">×</button>
    <div class="toast-progress"></div>
  `;
  container.appendChild(toast);
  setTimeout(() => closeToast(toast), 4000);
}

function closeToast(toast) {
  if (!toast || toast.classList.contains('hide')) return;
  toast.classList.add('hide');
  toast.addEventListener('animationend', () => toast.remove());
}

const flashDataEl = document.getElementById('flash-data');

if (flashDataEl) {
  const flashMessages = JSON.parse(flashDataEl.textContent);
  flashMessages.forEach(([category, message]) => {
    showToast(category, message);
  });
}
</script>
</body>
</html>
